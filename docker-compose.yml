services:
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    container_name: zot
    restart: unless-stopped

    ports:
      - "8080:5000"

    volumes:
      - ./config.json:/etc/zot/config.json:ro
      - zot-data:/var/lib/zot

    command: ["serve", "/etc/zot/config.json"]

volumes:
  zot-data:
